#
# Monitor service configuration.
# Copy to config.yaml and adjust for your environment.
#
# Environment variables override file-based paths:
#   MONITOR_CONFIG_PATH  — path to this file (default: /etc/monitor/config.yaml)
#   MONITOR_STATE_PATH   — path to state file (default: /var/lib/monitor/state.json)
#   TESSERA_PATH         — path to Tessera POSIX storage (default: /var/lib/tessera)

witness:
  # Unique name for this witness instance (appears in witnessed_indices table).
  name: "witness-1"

  # How often to poll Tessera for new entries.
  poll_interval: 30s

  # Max duration for verifying a single entry before timing out.
  # Must be greater than poll_interval.
  verification_timeout: 60s

# Publishers whose artifacts the witness will accept.
# Each entry specifies an OIDC issuer + subject pattern + allowed artifact types.
trusted_publishers:
  - name: "GitHub Actions (org)"
    issuer: "https://token.actions.githubusercontent.com"
    # Glob pattern: * matches any suffix. Only trailing wildcards are supported.
    sub: "repo:my-org/*"
    allowed_types:
      - EvaluationLog
      - EnforcementLog
      - Policy

  - name: "Internal CI"
    issuer: "https://auth.example.com"
    sub: "ci-pipeline@example.iam.gserviceaccount.com"
    allowed_types:
      - EvaluationLog
      - EnforcementLog
      - Policy
      - AuditLog
