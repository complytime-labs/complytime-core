# SPDX-License-Identifier: Apache-2.0
#
# Development-only JWT issuer for local testing.
# Issues tokens for any requested subject without authentication.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.testjwks.yml up
#
# DO NOT use in production or shared environments.

services:
  ingest:
    environment:
      JWT_ISSUERS: "http://testjwks:9090"
    depends_on:
      testjwks:
        condition: service_started

  testjwks:
    build:
      context: ../../
      dockerfile: Dockerfile.testjwks
    ports:
      - "9090:9090"
    environment:
      TESTJWKS_ISSUER: "http://testjwks:9090"
      TESTJWKS_ALLOW_UNSAFE: "true"
