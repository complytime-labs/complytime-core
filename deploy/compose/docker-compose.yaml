services:
  nats:
    image: nats:2.14-alpine
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data/jetstream
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 3

  testjwks:
    build:
      context: ../..
      dockerfile: Dockerfile.testjwks
    volumes:
      - service-tokens:/tokens
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8888/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  locker:
    build:
      context: ../..
      dockerfile: Dockerfile.locker
    environment:
      - LOCKER_DATA_PATH=/data/ledgers
      - LOCKER_LISTEN_ADDR=:8081
      - NATS_URL=nats://nats:4222
      - JWT_ISSUERS=http://testjwks:8888
      - JWT_AUDIENCE=complytime-locker
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_PROMETHEUS_PORT=9091
    volumes:
      - locker-data:/data/ledgers
    ports:
      - "8081:8081"
      - "9091:9091"
    depends_on:
      nats:
        condition: service_healthy
      testjwks:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile.gateway
    environment:
      - NATS_URL=nats://nats:4222
      - JWT_ISSUERS=http://testjwks:8888
      - JWT_AUDIENCE=complytime-gateway
      - GATEWAY_LISTEN_ADDR=:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_PROMETHEUS_PORT=9090
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      nats:
        condition: service_healthy
      locker:
        condition: service_healthy
      testjwks:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  memgraph:
    image: memgraph/memgraph:2.21.0
    ports:
      - "7687:7687"
    volumes:
      - memgraph-data:/var/lib/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  graph:
    build:
      context: ../..
      dockerfile: Dockerfile.graph
    environment:
      - NATS_URL=nats://nats:4222
      - LOCKER_URL=http://locker:8081
      - TOKEN_FILE=/tokens/graph-token
      - MEMGRAPH_URL=bolt://memgraph:7687
      - JWT_ISSUERS=http://testjwks:8888
      - JWT_AUDIENCE=complytime-graph
      - GRAPH_LISTEN_ADDR=:8082
    volumes:
      - service-tokens:/tokens:ro
    ports:
      - "8082:8082"
    depends_on:
      nats:
        condition: service_healthy
      locker:
        condition: service_healthy
      memgraph:
        condition: service_healthy
      testjwks:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  jaeger:
    image: docker.io/jaegertracing/jaeger:2.9.0
    ports:
      - "16686:16686"
      - "16687:16687"
      - "4317:4317"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16687/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  nats-data:
  locker-data:
  service-tokens:
  memgraph-data:
