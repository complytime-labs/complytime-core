# NATS Server Configuration — production-grade defaults
# For production clusters: increase to 3 nodes with routes configured.

server_name: complytime-nats

jetstream {
  store_dir: /data/jetstream
  max_mem_store: 256MB
  max_file_store: 4GB
}

# Limits
max_payload: 4MB
max_pending: 64MB

# Monitoring
http_port: 8222

# Logging
debug: false
trace: false
logtime: true

# Authorization — restrict admin NATS subjects to gateway only.
# In production, use decentralized JWT/NKey auth instead of plaintext passwords.
authorization {
  users = [
    {
      user: gateway
      password: gateway-dev-password
      permissions: {
        publish: {
          allow: [">"]
        }
        subscribe: {
          allow: [">"]
        }
      }
    }
    {
      user: locker
      password: locker-dev-password
      permissions: {
        publish: {
          allow: [">"]
          deny: ["core.admin.>"]
        }
        subscribe: {
          allow: [">"]
        }
      }
    }
    {
      user: graph
      password: graph-dev-password
      permissions: {
        publish: {
          allow: [">"]
          deny: ["core.admin.>"]
        }
        subscribe: {
          allow: [">"]
        }
      }
    }
  ]
}
