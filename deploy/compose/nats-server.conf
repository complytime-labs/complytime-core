# NATS Server Configuration — production-grade defaults
# For production clusters: increase to 3 nodes with routes configured.

server_name: complytime-nats

jetstream {
  store_dir: /data/jetstream
  max_mem_store: 256MB
  max_file_store: 4GB
}

# Limits
max_payload: 4MB
max_pending: 64MB

# Monitoring
http_port: 8222

# Logging
debug: false
trace: false
logtime: true
