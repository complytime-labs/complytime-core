# SPDX-License-Identifier: Apache-2.0
openapi: "3.1.0"
info:
  title: ComplyTime Ingest API
  version: "1.0.0"
  description: |
    Compliance evidence ingestion and transparency log API.
    Accepts Gemara artifacts, appends to Tessera, publishes events to NATS.
    Query endpoints have moved to CrossCodex.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /api/ingest:
    post:
      operationId: ingestArtifact
      summary: Submit a Gemara artifact for ingestion
      description: |
        Accepts a raw Gemara YAML artifact, appends it to the Tessera
        transparency log, and publishes a NATS event for async processing.
        Requires JWT authentication. Publisher authorization is checked
        against the per-target allowlist in NATS KV (fail-closed).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema:
              type: string
              description: Raw Gemara YAML artifact
      responses:
        "202":
          description: Accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "401":
          description: Authentication required
        "403":
          description: JWT verification failed or publisher not authorized
        "429":
          description: Rate limit exceeded
        "503":
          description: NATS KV unavailable (fail-closed)

  /api/ingest/jobs/{job_id}:
    get:
      operationId: getIngestJobStatus
      summary: Poll ingest job status
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestJobStatus"
        "404":
          description: Job not found or expired

  /api/import:
    post:
      operationId: importBundle
      summary: Import an OCI bundle
      description: |
        Accepts a JSON body with an OCI reference, unpacks the bundle,
        and routes each artifact through the ingest pipeline.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference]
              properties:
                reference:
                  type: string
                  description: OCI artifact reference
      responses:
        "202":
          description: Bundle accepted for processing
        "400":
          description: Invalid request
        "502":
          description: Registry pull failed

  /api/config:
    get:
      operationId: getConfig
      summary: Application configuration (public)
      responses:
        "200":
          description: Non-secret configuration values
          content:
            application/json:
              schema:
                type: object

  /api/system-info:
    get:
      operationId: getSystemInfo
      summary: System status
      responses:
        "200":
          description: System information
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  storage:
                    type: string
                  nats:
                    type: string

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Current user identity
      responses:
        "200":
          description: Identity from OAuth2 Proxy headers
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  name:
                    type: string

  /healthz:
    get:
      operationId: healthCheck
      summary: Liveness probe
      description: Checks NATS connectivity
      responses:
        "200":
          description: Healthy
        "503":
          description: NATS unreachable

  /checkpoint:
    get:
      operationId: getCheckpoint
      summary: Cosigned checkpoint (tlog-tiles)
      description: |
        Returns the current signed checkpoint in sumdb note format.
        Public, no authentication required.
      responses:
        "200":
          description: Signed checkpoint with witness cosignatures
          content:
            text/plain:
              schema:
                type: string

  /tile/{path}:
    get:
      operationId: getTile
      summary: Merkle tree tile or entry bundle (tlog-tiles)
      description: |
        Serves Tessera POSIX storage tiles for offline inclusion proof
        computation. Public, no authentication required.
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tile data
        "404":
          description: Tile not found

  /log/witnessed/{index}:
    get:
      operationId: getWitnessedStatus
      summary: Witnessed status for a log index
      description: |
        Reports whether a given log index is covered by a witnessed
        (cosigned) checkpoint. Public, no authentication required.
      parameters:
        - name: index
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        "200":
          description: Witnessed status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WitnessedStatus"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC JWT token from a configured issuer

  schemas:
    IngestResponse:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        log_index:
          type: integer
          format: uint64
        status:
          type: string
          enum: [pending]

    IngestJobStatus:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, completed, failed]
        inserted:
          type: integer
        policy_id:
          type: string
        artifact_id:
          type: string
        artifact_type:
          type: string
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WitnessedStatus:
      type: object
      properties:
        index:
          type: integer
          format: uint64
        witnessed:
          type: boolean
        tree_size:
          type: integer
          format: uint64
        witness_count:
          type: integer
