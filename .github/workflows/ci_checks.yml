# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: none
  pull-requests: read

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test ./... -count=1 -v
      - name: Integration tests
        run: go test ./internal/gateway/ -tags integration -count=1 -v

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [Dockerfile.gateway, Dockerfile.locker]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build image (no push)
        run: docker build -f ${{ matrix.dockerfile }} .

  cedar-validate:
    name: Cedar Policy Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Cedar CLI
        run: cargo install cedar-policy-cli
      - name: Validate Cedar policies against schema
        run: make cedar-validate

  acceptance-test:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [go-test, docker-build]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Start services
        run: docker compose -f deploy/compose/docker-compose.yaml up -d --wait --timeout 120
      - name: Wait for services
        run: |
          for svc in gateway locker; do
            for i in $(seq 1 30); do
              if curl -sf http://localhost:808$( [ "$svc" = "gateway" ] && echo 0 || echo 1 )/healthz > /dev/null 2>&1; then
                echo "$svc is healthy"
                break
              fi
              sleep 2
            done
          done
      - name: Run acceptance tests
        run: go test -tags acceptance ./test/acceptance/ -v -timeout 5m -ginkgo.label-filter='!graph'
      - name: Service logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yaml logs
      - name: Teardown
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yaml down -v

  call_reusable_ci:
    name: Standardized CI
    uses: complytime/org-infra/.github/workflows/reusable_ci.yml@638b2037394ca0f0b860a135c7c27dce75fd3c03 # v0.5.0
    permissions:
      contents: read
      issues: read
      pull-requests: read
