# SPDX-License-Identifier: Apache-2.0
name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: none
  id-token: none
  security-events: none
  packages: none

jobs:
  call_reusable_vuln_scan:
    name: OSV-Scanner
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: complytime/org-infra/.github/workflows/reusable_vuln_scan.yml@bbd7194995388f96dd28c0c0792d406c8a249140 # v0.4.0
    with:
      enable_trivy_source: true

  call_reusable_security:
    name: OpenSSF Scorecards
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: complytime/org-infra/.github/workflows/reusable_security.yml@15476efc3c2837fa9564943a1f8714cd71ddc288 # v0.3.0
