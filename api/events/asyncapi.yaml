asyncapi: 3.0.0
info:
  title: ComplyTime Core Events
  version: 0.1.0
  description: |
    NATS event contract for the ComplyTime evidence lifecycle.

    All public events use CloudEvents v1.0 envelope (JSON format) over NATS.
    The `core.ingest` subject is an internal JetStream work queue and is not
    part of the external consumer contract. The `core.mapping.imported`
    subject is reserved for future use but not yet implemented.

    All events are published by the gateway service (`complytime-gateway`).
  license:
    name: Apache-2.0
  contact:
    name: ComplyTime Labs
    url: https://github.com/complytime-labs/complytime-core

defaultContentType: application/cloudevents+json

servers:
  default:
    host: localhost:4222
    protocol: nats
    description: NATS server (development)

channels:
  evidenceIngested:
    address: core.evidence.ingested.{subjectId}
    description: |
      Published when evidence is ingested by the gateway, before sealing.
      Part of the EVIDENCE JetStream stream (`core.evidence.>`).
    parameters:
      subjectId:
        description: The compliance subject identifier (e.g. `my-app-v1`)
    messages:
      evidenceIngested:
        $ref: '#/components/messages/evidenceIngested'

  evidenceSealed:
    address: core.evidence.sealed.{subjectId}
    description: |
      Published after evidence is sealed with a verifiable receipt.
      Part of the EVIDENCE JetStream stream (`core.evidence.>`).
    parameters:
      subjectId:
        description: The compliance subject identifier
    messages:
      evidenceSealed:
        $ref: '#/components/messages/evidenceSealed'

  subjectRegistered:
    address: core.subject.registered
    description: |
      Published when a compliance subject is registered or updated.
      This is a core NATS pub/sub subject with no JetStream retention —
      consumers must be connected when the event fires.
    messages:
      subjectRegistered:
        $ref: '#/components/messages/subjectRegistered'

operations:
  publishEvidenceIngested:
    action: send
    channel:
      $ref: '#/channels/evidenceIngested'
    summary: Gateway publishes when evidence is accepted for processing.

  publishEvidenceSealed:
    action: send
    channel:
      $ref: '#/channels/evidenceSealed'
    summary: Gateway worker publishes after evidence is sealed with a verifiable receipt.

  publishSubjectRegistered:
    action: send
    channel:
      $ref: '#/channels/subjectRegistered'
    summary: Gateway publishes when a subject is registered.

  consumeEvidenceIngested:
    action: receive
    channel:
      $ref: '#/channels/evidenceIngested'
    summary: |
      Consume evidence-ingested events via the EVIDENCE JetStream stream
      (interest-based retention, 7-day max age).

  consumeEvidenceSealed:
    action: receive
    channel:
      $ref: '#/channels/evidenceSealed'
    summary: |
      Consume evidence-sealed events via the EVIDENCE JetStream stream
      (interest-based retention, 7-day max age).

components:
  messages:
    evidenceIngested:
      name: EvidenceIngested
      title: Evidence Ingested
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/EvidenceIngestedCloudEvent'

    evidenceSealed:
      name: EvidenceSealed
      title: Evidence Sealed
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/EvidenceSealedCloudEvent'

    subjectRegistered:
      name: SubjectRegistered
      title: Subject Registered
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/SubjectRegisteredCloudEvent'

  schemas:
    # --- CloudEvents envelopes ---

    EvidenceIngestedCloudEvent:
      type: object
      description: CloudEvents v1.0 envelope for evidence.ingested
      required: [specversion, id, type, source, subject, time, datacontenttype, data]
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
          format: uuid
        type:
          type: string
          const: dev.complytime.evidence.ingested
        source:
          type: string
          description: URI identifying the gateway instance
          examples: [complytime-gateway]
        subject:
          type: string
          description: The compliance subject identifier
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        data:
          $ref: '#/components/schemas/EvidenceIngestedData'

    EvidenceSealedCloudEvent:
      type: object
      description: CloudEvents v1.0 envelope for evidence.sealed
      required: [specversion, id, type, source, subject, time, datacontenttype, data]
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
          format: uuid
        type:
          type: string
          const: dev.complytime.evidence.sealed
        source:
          type: string
          description: URI identifying the gateway instance
          examples: [complytime-gateway]
        subject:
          type: string
          description: The compliance subject identifier
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        data:
          $ref: '#/components/schemas/EvidenceSealedData'

    SubjectRegisteredCloudEvent:
      type: object
      description: CloudEvents v1.0 envelope for subject.registered
      required: [specversion, id, type, source, subject, time, datacontenttype, data]
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
          format: uuid
        type:
          type: string
          const: dev.complytime.subject.registered
        source:
          type: string
          description: URI identifying the gateway instance
          examples: [complytime-gateway]
        subject:
          type: string
          description: The compliance subject identifier
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        data:
          $ref: '#/components/schemas/SubjectRegisteredData'

    # --- Data payloads (match events/events.go) ---

    EvidenceIngestedData:
      type: object
      description: Payload for evidence.ingested events.
      required: [contentDigest, artifactType, storageRef, subjectId, publisher]
      properties:
        contentDigest:
          type: string
          description: SHA-256 digest of the evidence artifact
          examples: [sha256:abc123...]
        artifactType:
          type: string
          description: Gemara artifact type
          examples: [application/vnd.gemara.evaluation-log+json]
        storageRef:
          type: string
          description: Internal storage reference
        subjectId:
          type: string
          description: Compliance subject identifier
          examples: [my-app-v1]
        publisher:
          $ref: '#/components/schemas/PublisherIdentity'
        shardId:
          type: string
          description: Subject shard identifier (null when sharding is not configured)

    EvidenceSealedData:
      type: object
      description: Payload for evidence.sealed events.
      required: [contentDigest, logIndex, receiptDigest, receiptType, storageRef, subjectId]
      properties:
        contentDigest:
          type: string
          description: SHA-256 digest of the sealed evidence
          examples: [sha256:abc123...]
        logIndex:
          type: integer
          format: int64
          description: Transparency log index assigned by the locker
        receiptDigest:
          type: string
          description: Digest of the transparency receipt (inclusion proof)
        receiptType:
          type: string
          description: Receipt format identifier
          examples: [gemara-receipt/v1, gemara-dsse-channel-receipt/v1]
        storageRef:
          type: string
          description: Locker storage reference for the sealed evidence
        subjectId:
          type: string
          description: Compliance subject identifier
        shardId:
          type: string
          description: Subject shard identifier (null when sharding is not configured)

    SubjectRegisteredData:
      type: object
      description: Payload for subject.registered events.
      required: [subjectId]
      properties:
        subjectId:
          type: string
          description: The registered compliance subject identifier

    PublisherIdentity:
      type: object
      description: Identity of the entity that produced the evidence.
      required: [issuer, sub]
      properties:
        issuer:
          type: string
          description: OIDC issuer URL
          examples: [https://accounts.google.com]
        sub:
          type: string
          description: OIDC subject claim
          examples: [ci-pipeline@project.iam.gserviceaccount.com]
