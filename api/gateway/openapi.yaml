openapi: 3.0.3
info:
  title: Evidence Gateway API
  description: HTTP API for the Evidence Gateway ingest and admin service
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /healthz:
    get:
      summary: Health check endpoint
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok

  /api/ingest:
    post:
      summary: Submit artifact for ingestion
      operationId: ingestArtifact
      parameters:
        - name: X-Subject-ID
          in: header
          required: true
          schema:
            type: string
          description: Subject identifier for the artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw artifact JSON
          application/vnd.dsse+json:
            schema:
              type: object
              description: DSSE envelope
      responses:
        '202':
          description: Artifact accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Artifact failed Gemara schema validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    IngestResponse:
      type: object
      required:
        - jobId
      properties:
        jobId:
          type: string
          format: uuid
          description: Unique identifier for the ingestion job

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message

    ValidationError:
      type: object
      required:
        - error
        - artifactType
        - details
      properties:
        error:
          type: string
          description: Error message
        artifactType:
          type: string
          description: Type of artifact that failed validation
        details:
          type: array
          items:
            type: string
          description: Field-level validation errors
