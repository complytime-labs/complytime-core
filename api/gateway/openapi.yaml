openapi: 3.0.3
info:
  title: Evidence Gateway API
  description: HTTP API for the Evidence Gateway ingest and admin service
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /healthz:
    get:
      summary: Health check endpoint
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok

  /admin/subjects:
    post:
      operationId: RegisterSubject
      summary: Register a new subject for compliance tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectRegistrationRequest'
      responses:
        '201':
          description: Subject registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectRegistrationResponse'
        '400':
          description: Invalid request
        '403':
          description: Not authorized (admin required)
      security:
        - bearerAuth: []

  /admin/subjects/{subjectId}/trust:
    put:
      operationId: ModifyTrust
      summary: Modify trusted publishers for a subject
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyTrustRequest'
      responses:
        '200':
          description: Trust updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifyTrustResponse'
        '400':
          description: Invalid request
        '403':
          description: Not authorized (admin required)
      security:
        - bearerAuth: []

  /api/ingest:
    post:
      summary: Submit artifact for ingestion
      operationId: ingestArtifact
      parameters:
        - name: X-Subject-ID
          in: header
          required: true
          schema:
            type: string
          description: Subject identifier for the artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw artifact JSON
          application/vnd.dsse+json:
            schema:
              type: object
              description: DSSE envelope
      responses:
        '202':
          description: Artifact accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Artifact failed Gemara schema validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SubjectRegistrationRequest:
      type: object
      required:
        - subjectId
        - trustedPublishers
      properties:
        subjectId:
          type: string
          description: Package URL identifying the subject
        trustedPublishers:
          type: array
          items:
            $ref: '#/components/schemas/TrustedPublisher'
        scannerJwk:
          $ref: '#/components/schemas/ScannerJWK'
          description: Optional static JWK for scanner issuers without OIDC

    ScannerJWK:
      type: object
      required:
        - jwk
        - not_after
      properties:
        jwk:
          type: object
          description: JWK public key (RFC 7517)
          additionalProperties: true
        not_after:
          type: string
          format: date-time
          description: Key expiry timestamp (RFC 3339)

    TrustedPublisher:
      type: object
      required:
        - issuer
        - sub
      properties:
        issuer:
          type: string
        sub:
          type: string

    SubjectRegistrationResponse:
      type: object
      properties:
        subjectId:
          type: string

    ModifyTrustRequest:
      type: object
      required:
        - trustedPublishers
      properties:
        trustedPublishers:
          type: array
          items:
            $ref: '#/components/schemas/TrustedPublisher'

    ModifyTrustResponse:
      type: object
      properties:
        subjectId:
          type: string

    IngestResponse:
      type: object
      required:
        - jobId
      properties:
        jobId:
          type: string
          format: uuid
          description: Unique identifier for the ingestion job

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message

    ValidationError:
      type: object
      required:
        - error
        - artifactType
        - details
      properties:
        error:
          type: string
          description: Error message
        artifactType:
          type: string
          description: Type of artifact that failed validation
        details:
          type: array
          items:
            type: string
          description: Field-level validation errors
