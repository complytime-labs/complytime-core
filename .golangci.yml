version: "2"
run:
  skip-dirs:
    - vendor
linters:
  default: standard
  enable:
    - gosec
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
