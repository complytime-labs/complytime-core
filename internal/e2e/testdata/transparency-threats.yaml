title: Transparency Log Threat Catalog
metadata:
  id: complytime-ingest-tlog-threats
  type: ThreatCatalog
  gemara-version: "1.3.0"
  description: >-
    STRIDE-based threat catalog for ComplyTime Ingest's transparency log.
    Identifies threats to the append-only evidence ledger and its verification
    properties. Assessment of these threats is performed by corresponding
    controls in complytime-ingest-tlog-controls.
  author:
    id: complytime-team
    name: ComplyTime Team
    type: Human
  mapping-references:
    - id: tlog-capabilities
      title: Transparency Log Capabilities
      version: "1.0.0"
      description: Core capabilities of the Tessera-backed transparency log
groups:
  - id: spoofing
    title: Spoofing
    description: Threats involving impersonation of identities or components
  - id: tampering
    title: Tampering
    description: Threats involving unauthorized modification of log data or state
  - id: repudiation
    title: Repudiation
    description: Threats where actions or states cannot be independently verified
  - id: information-disclosure
    title: Information Disclosure
    description: Threats involving exposure of sensitive operational details
  - id: denial-of-service
    title: Denial of Service
    description: Threats that degrade or prevent log availability
  - id: elevation-of-privilege
    title: Elevation of Privilege
    description: Threats involving unauthorized expansion of trust or authority
threats:
  - id: T-TAMP-01
    title: Log equivocation
    description: >-
      The log operator presents different views of the log to different clients,
      forking the append-only history. Without independent witness cosignatures,
      clients have no way to detect that the log has been split.
    group: tampering
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Checkpoint publication
  - id: T-REP-01
    title: Unverifiable log inclusion
    description: >-
      A client that submitted evidence and received a log_index cannot
      independently verify that their entry is included in the log's Merkle
      tree. The log serves no checkpoint, tiles, or inclusion proofs over HTTP.
    group: repudiation
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Entry storage and retrieval
  - id: T-REP-02
    title: Checkpoint signer key loss on restart
    description: >-
      The checkpoint signer key is generated fresh on every process start.
      After a restart, all prior checkpoint signatures become unverifiable
      because the public key has changed, enabling denial of prior log state.
    group: repudiation
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Checkpoint signing
  - id: T-REP-03
    title: Unverifiable witnessed status
    description: >-
      A client holding a log_index cannot determine whether their entry has
      been covered by a witnessed (cosigned) checkpoint. No endpoint reports
      whether a given index falls within a cosigned checkpoint's tree size.
    group: repudiation
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Witness verification status
  - id: T-ELEV-01
    title: Monitor conflated with witness
    description: >-
      The content monitor (cmd/monitor) verifies Gemara schema, trust signals,
      and publisher trust, but does not verify log consistency or cosign
      checkpoints. Conflating it with an anti-equivocation witness creates
      false confidence that fork detection is in place when it is not.
    group: elevation-of-privilege
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Content verification
  - id: T-TAMP-02
    title: Monitor fails to detect invalid evidence
    description: >-
      The content monitor (cmd/monitor) fails to reject evidence that does not
      conform to the Gemara schema, has an untrusted publisher, or references
      nonexistent policies. Downstream consumers trust the monitor's verification
      and process invalid evidence.
    group: tampering
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Content verification
  - id: T-SPOOF-01
    title: Publisher trust check bypassed
    description: >-
      A submission bypasses the publisher trust check by presenting a valid JWT
      from an issuer/subject pair not in the trusted publishers list but not
      rejected by the monitor. The evidence appears trustworthy but comes from
      an unauthorized source.
    group: spoofing
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Publisher identity verification
  - id: T-DOS-01
    title: Evidence flooding via ingest endpoint
    description: >-
      An attacker submits a high volume of evidence to the ingest endpoint,
      exhausting Tessera storage and NATS queue capacity. Without authentication
      and rate limiting, the log grows unboundedly with garbage entries that
      cannot be removed from the append-only store.
    group: denial-of-service
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Evidence ingestion
  - id: T-DOS-02
    title: Public endpoint flooding
    description: >-
      An attacker sends a high volume of requests to the unauthenticated tlog
      read endpoints (/checkpoint, /tile/*, /log/witnessed/:index), exhausting
      ingest service resources. These endpoints have no application-level rate limiting.
      Mitigation is infrastructure-level: reverse proxy rate limiting, CDN
      caching for immutable tiles, or network-layer DDoS protection.
    group: denial-of-service
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Checkpoint publication
  - id: T-INFO-02
    title: Unauthenticated checkpoint access reveals operational cadence
    description: >-
      Unauthenticated access to the checkpoint endpoint exposes log operational
      metadata — tree size, publication frequency, and growth rate — to any
      network observer. This enables reconnaissance of evidence submission
      patterns and organizational compliance activity.
    group: information-disclosure
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Checkpoint publication
  - id: T-INFO-03
    title: Unauthenticated tile access exposes compliance evidence content
    description: >-
      Unauthenticated access to tile entry bundles exposes compliance evidence
      content — vulnerability scan results, control assessments, and security
      posture data — to any network observer without authentication.
    group: information-disclosure
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Entry storage and retrieval
  - id: T-TAMP-03
    title: Publisher trust state loss
    description: >-
      The NATS KV bucket containing publisher allowlists is lost or corrupted.
      Without rebuild from Tessera, publisher authorization checks fail and
      all ingestion is rejected (fail-closed). Recovery requires replaying
      TargetRegistration entries from the transparency log.
    group: tampering
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Publisher identity verification
  - id: T-REP-04
    title: Certification results not locally persisted
    description: >-
      Trust signals (schema, provenance, executor checks) are published as
      NATS events but not stored by the ingest service. If no downstream
      subscriber persists them, certification state is lost and cannot be
      audited after the fact.
    group: repudiation
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Content verification
  - id: T-DOS-03
    title: NATS KV unavailability blocks ingestion
    description: >-
      Publisher trust lookup is fail-closed. If NATS KV is unavailable, all
      ingestion is rejected until KV recovers. This is an accepted tradeoff:
      integrity over availability, since Tessera is append-only and bad
      evidence cannot be removed.
    group: denial-of-service
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Evidence ingestion
  - id: T-SPOOF-02
    title: Unauthenticated token issuance forges publisher identity
    description: >-
      A token issuer included in the deployment for development purposes
      issues signed identity tokens for arbitrary subjects without requiring
      authentication. If this issuer is trusted by the gateway in a non-
      development context, an attacker can forge any publisher identity and
      permanently anchor fraudulent evidence in the append-only log.
    group: spoofing
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Publisher identity verification
  - id: T-SPOOF-03
    title: Gateway authentication bypass via proxy header forgery
    description: >-
      The gateway derives user identity from headers set by a reverse proxy.
      If the gateway is reachable without traversing the proxy, an attacker
      can forge identity headers and authenticate as any user, including
      administrators. The gateway has no independent mechanism to verify
      that headers originated from a trusted proxy.
    group: spoofing
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Evidence ingestion
  - id: T-TAMP-04
    title: Silent witness degradation removes anti-equivocation guarantee
    description: >-
      If the system is configured to continue appending entries when the
      witness service is unavailable, the anti-equivocation guarantee
      silently degrades to single-operator trust. During this window, log
      equivocation becomes undetectable by relying parties. Operators may
      not be aware that witnessing has stopped.
    group: tampering
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Checkpoint publication
  - id: T-TAMP-05
    title: Witness binary supply chain compromise
    description: >-
      The witness binary is fetched from an external source at build time
      without artifact integrity verification. A supply chain compromise
      could substitute a malicious binary that forges checkpoint cosignatures
      or exfiltrates signing key material. All checkpoint signatures produced
      by a compromised witness are untrustworthy.
    group: tampering
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Checkpoint signing
  - id: T-DOS-04
    title: Rate limiter key spoofing bypasses ingest throttling
    description: >-
      If the ingest rate limiter derives its client identity from a
      client-controlled input, an attacker can present a different identity
      per request to allocate a fresh rate-limit bucket each time, bypassing
      per-client throttling. A single session can then flood the ingest
      endpoint, exhausting log storage or message queue capacity.
    group: denial-of-service
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Evidence ingestion
  - id: T-ELEV-02
    title: Cedar policy directory override
    description: >-
      An attacker with write access to the Cedar policy directory drops a
      permissive policy file that widens authorization beyond the intended
      model. Without merge semantics and forbid safety floors, directory
      policies could replace the entire embedded policy set.
    group: elevation-of-privilege
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Evidence ingestion
  - id: T-ELEV-03
    title: TargetRegistration trust escalation
    description: >-
      An authenticated publisher submits a TargetRegistration artifact that
      adds themselves as a trusted publisher for a target they are not
      authorized to publish to. Without trust modification restrictions, the
      ability to register targets escalates to the ability to publish evidence
      for any target.
    group: elevation-of-privilege
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Publisher identity verification
  - id: T-SPOOF-04
    title: Import path bypasses publisher trust
    description: >-
      The OCI bundle import endpoint (POST /api/import) processes artifacts
      with a synthetic publisher identity and no target-scoped trust check.
      An authenticated user can import evidence for any target, bypassing
      the publisher authorization model enforced on the ingest endpoint.
    group: spoofing
    capabilities:
      - reference-id: tlog-capabilities
        entries:
          - reference-id: tlog-capabilities
            remarks: Evidence ingestion
