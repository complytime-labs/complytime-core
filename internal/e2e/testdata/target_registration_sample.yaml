metadata:
  type: TargetRegistration
  id: prod-cluster-reg-v1
  version: 1.0.0
  date: "2026-05-26T10:00:00Z"
  author:
    name: platform-team

target:
  id: pkg:generic/acme/prod-cluster@v1
  name: Production Kubernetes Cluster
  type: kubernetes-cluster

  trusted-publishers:
    - issuer: https://token.actions.githubusercontent.com
      sub_pattern: "repo:acme/compliance-scanner:*"
      environment: production
    - issuer: https://accounts.google.com
      sub_pattern: "scanner@acme-prod.iam.gserviceaccount.com"

dimensions:
  technologies:
    - kubernetes
    - postgresql
  geopolitical:
    - EU
  sensitivity:
    - confidential
