title: Transparency Log Control Catalog
metadata:
  id: complytime-ingest-tlog-controls
  type: ControlCatalog
  gemara-version: "1.3.0"
  description: >-
    Controls for ComplyTime Ingest's transparency log. Each assessment
    requirement maps to a Ginkgo BDD spec that verifies the security property.
  author:
    id: complytime-team
    name: ComplyTime Team
    type: Human
  mapping-references:
    - id: tlog-threats
      title: Transparency Log Threat Catalog
      version: "1.0.0"
      description: STRIDE threats for the transparency log
  applicability-groups:
    - id: all
      title: All Deployments
      description: Applies to all deployment profiles
    - id: airgap
      title: Air-Gapped Deployments
      description: Applies only to air-gapped deployment profiles
groups:
  - id: anti-equivocation
    title: Anti-Equivocation
    description: Controls ensuring the log cannot present inconsistent views
  - id: client-verification
    title: Client Verification
    description: Controls enabling independent verification by external clients
  - id: content-integrity
    title: Content Integrity
    description: Controls ensuring evidence in the log is well-formed and from trusted sources
  - id: operational-integrity
    title: Operational Integrity
    description: Controls ensuring correct operational separation and identity
  - id: access-control
    title: Access Control
    description: Controls enforcing authentication and authorization on API endpoints
controls:
  - id: CTRL-AE-01
    title: Witness Cosigned Checkpoints
    objective: >-
      Checkpoints are cosigned by at least one independent witness, enabling
      clients to detect log equivocation by verifying cosignatures from
      parties outside the log operator's trust domain.
    group: anti-equivocation
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-TAMP-01 (log equivocation)
    state: Active
    assessment-requirements:
      - id: CTRL-AE-01.1
        text: >-
          Checkpoints published by the log MUST carry at least one witness
          cosignature verifiable with a known witness public key.
        applicability: [all]
        state: Active
      - id: CTRL-AE-01.2
        text: >-
          The witness quorum policy MUST be satisfied before a checkpoint
          is considered fully witnessed.
        applicability: [all]
        state: Active
  - id: CTRL-CV-01
    title: Persistent Checkpoint Signer
    objective: >-
      The checkpoint signer key is loaded from stable storage so that
      checkpoint signatures remain verifiable across process restarts.
    group: client-verification
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-REP-02 (signer key loss)
    state: Active
    assessment-requirements:
      - id: CTRL-CV-01.1
        text: >-
          The log public key MUST be stable across process restarts. A
          checkpoint signed before a restart MUST still verify after.
        applicability: [all]
        state: Active
  - id: CTRL-CV-02
    title: Standard tlog-tiles Read API
    objective: >-
      The log serves checkpoints, Merkle tree tiles, and entry bundles over
      HTTP following the C2SP tlog-tiles specification, enabling clients to
      compute and verify inclusion proofs offline.
    group: client-verification
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-REP-01 (unverifiable inclusion)
    state: Active
    assessment-requirements:
      - id: CTRL-CV-02.1
        text: >-
          The log MUST serve a signed checkpoint at the /checkpoint path
          that is a valid signed note.
        applicability: [all]
        state: Active
      - id: CTRL-CV-02.2
        text: >-
          The log MUST serve tile data sufficient for a client to compute
          an inclusion proof for any appended entry.
        applicability: [all]
        state: Active
      - id: CTRL-CV-02.3
        text: >-
          A client holding a log_index MUST be able to fetch the checkpoint
          and tiles, compute an inclusion proof, and verify the entry is
          included in the checkpoint's Merkle root offline.
        applicability: [all]
        state: Active
  - id: CTRL-CV-03
    title: Witnessed Status Endpoint
    objective: >-
      Clients can query whether a specific log index has been covered by a
      witnessed checkpoint without computing proofs themselves.
    group: client-verification
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-REP-03 (unverifiable witnessed status)
    state: Active
    assessment-requirements:
      - id: CTRL-CV-03.1
        text: >-
          The log MUST provide an endpoint that reports whether a given
          log_index is covered by a witnessed checkpoint and the number
          of witness cosignatures present.
        applicability: [all]
        state: Active
      - id: CTRL-CV-03.2
        text: >-
          The endpoint MUST report witnessed=false for a log_index beyond
          the current checkpoint tree size.
        applicability: [all]
        state: Active
  - id: CTRL-OI-01
    title: Monitor and Witness Separation
    objective: >-
      Content monitoring (Gemara schema, trust signals, publisher trust) is
      clearly separated from anti-equivocation witnessing (consistency proofs,
      checkpoint cosigning). Each has a distinct service, name, and role.
    group: operational-integrity
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-ELEV-01 (role conflation)
    state: Active
    assessment-requirements:
      - id: CTRL-OI-01.1
        text: >-
          The content verification service MUST be documented as a monitor
          distinct from the anti-equivocation witness, with separate binary
          names, ADRs, and deployment configurations.
        applicability: [all]
        state: Active
  - id: CTRL-CI-01
    title: Monitor Schema Validation
    objective: >-
      The content monitor rejects evidence that does not conform to the Gemara
      schema, ensuring downstream consumers receive only well-formed artifacts.
    group: content-integrity
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-TAMP-02 (invalid evidence)
    state: Draft
    assessment-requirements:
      - id: CTRL-CI-01.1
        text: >-
          The content monitor MUST reject evidence with an invalid or missing
          Gemara metadata.type field.
        applicability: [all]
        state: Draft
  - id: CTRL-CI-02
    title: Monitor Publisher Trust Verification
    objective: >-
      The content monitor verifies that the publisher's JWT issuer and subject
      match a configured trusted publisher pattern before accepting evidence.
    group: content-integrity
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-SPOOF-01 (publisher trust bypass)
    state: Draft
    assessment-requirements:
      - id: CTRL-CI-02.1
        text: >-
          The content monitor MUST verify that the publisher's issuer and
          subject match at least one trusted publisher pattern.
        applicability: [all]
        state: Draft
  - id: CTRL-OI-03
    title: Ingest Endpoint Rate Limiting and Authentication
    objective: >-
      The ingest endpoint requires authentication and enforces rate limits to
      prevent evidence flooding from exhausting log storage and pipeline
      resources.
    group: operational-integrity
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-DOS-01 (evidence flooding)
    state: Draft
    assessment-requirements:
      - id: CTRL-OI-03.1
        text: >-
          The ingest endpoint MUST reject unauthenticated requests before
          appending to the transparency log.
        applicability: [all]
        state: Draft
      - id: CTRL-OI-03.2
        text: >-
          The ingest endpoint MUST enforce a configurable rate limit per
          caller to bound submission volume.
        applicability: [all]
        state: Draft
  - id: CTRL-CI-05
    title: Ingest Boundary Publisher Authorization
    objective: >-
      The ingest service evaluates Cedar publish:artifact authorization,
      checking the JWT caller's issuer and subject against the per-target
      publisher allowlist in NATS KV. Cedar's forbid safety floor ensures
      this check cannot be bypassed by directory-added policies.
    group: content-integrity
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-SPOOF-01 (publisher trust bypass)
    state: Active
    assessment-requirements:
      - id: CTRL-CI-05.1
        text: >-
          The ingest service MUST reject evidence submissions from publishers
          whose JWT issuer/subject do not match any entry in the target's
          trusted publisher allowlist.
        applicability: [all]
        state: Active
      - id: CTRL-CI-05.2
        text: >-
          The ingest service MUST reject evidence submissions for targets
          with no trusted publishers configured (deny by default).
        applicability: [all]
        state: Active
      - id: CTRL-CI-05.3
        text: >-
          The ingest service MUST deny evidence submissions when the
          TrustedPublisherStore is unavailable (fail-secure).
        applicability: [all]
        state: Active
  - id: CTRL-CI-03
    title: Publisher Trust Fail-Closed on KV Unavailability
    objective: >-
      When the NATS KV bucket for publisher trust is unavailable, the ingest
      service rejects all submissions rather than accepting without authorization.
      Integrity over availability — Tessera is append-only.
    group: content-integrity
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-TAMP-03 (trust state loss) and T-DOS-03 (KV unavailability)
    state: Active
    assessment-requirements:
      - id: CTRL-CI-03.1
        text: >-
          The ingest service MUST reject evidence submissions with HTTP 503
          when the publisher trust NATS KV bucket is unreachable.
        applicability: [all]
        state: Active
  - id: CTRL-CI-04
    title: Publisher Trust State Rebuildable from Tessera
    objective: >-
      The NATS KV publisher trust state can be fully rebuilt by replaying
      TargetRegistration entries from the Tessera transparency log. No
      external state is required beyond what Tessera already stores.
    group: content-integrity
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-TAMP-03 (trust state loss)
    state: Draft
    assessment-requirements:
      - id: CTRL-CI-04.1
        text: >-
          After a NATS KV bucket loss, the ingest service MUST rebuild the
          publisher trust state by replaying all TargetRegistration entries
          from Tessera before accepting new submissions.
        applicability: [all]
        state: Draft
  - id: CTRL-OI-04
    title: Certification Events Durable in NATS JetStream
    objective: >-
      Certification results (trust signals) are published to durable NATS
      JetStream streams so downstream subscribers can persist and query them.
      The ingest service does not store certification results locally.
    group: operational-integrity
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-REP-04 (certification results not persisted)
    state: Draft
    assessment-requirements:
      - id: CTRL-OI-04.1
        text: >-
          Certification results MUST be published to a durable NATS JetStream
          stream with at-least-once delivery guarantees.
        applicability: [all]
        state: Draft
  - id: CTRL-OI-02
    title: Zero-Egress Air-Gap Conformance
    objective: >-
      The ingest pipeline operates with zero runtime network egress under
      the air-gap deployment profile, using an in-enclave OIDC IdP for
      identity verification.
    group: operational-integrity
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-INFO-01 (JWKS egress dependency)
    state: Draft
    assessment-requirements:
      - id: CTRL-OI-02.1
        text: >-
          Under the airgap profile, the full pipeline (ingest, append,
          witness, checkpoint export, verify) MUST complete with all
          network egress blocked.
        applicability: [airgap]
        state: Draft
  - id: CTRL-AC-01
    title: Default-Deny Authorization Middleware
    objective: >-
      All HTTP endpoints require authentication and Cedar policy authorization
      by default. Only explicitly exempted paths (/healthz, /auth/*) bypass
      the authorization check.
    group: access-control
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-SPOOF-03 (proxy header forgery bypass)
    state: Active
    assessment-requirements:
      - id: CTRL-AC-01.1
        text: >-
          A request to any endpoint other than /healthz or /auth/* without
          a valid X-Forwarded-Email header MUST receive HTTP 401.
        applicability: [all]
        state: Active
      - id: CTRL-AC-01.2
        text: >-
          A request with a valid identity but no matching Cedar permit
          policy MUST receive HTTP 403.
        applicability: [all]
        state: Active
  - id: CTRL-AC-02
    title: Authenticated Checkpoint Access
    objective: >-
      Checkpoint metadata is accessible only to authenticated identities on
      the primary listener. The internal listener provides unauthenticated
      access for the witness service only.
    group: access-control
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-INFO-02 (checkpoint metadata disclosure)
    state: Active
    assessment-requirements:
      - id: CTRL-AC-02.1
        text: >-
          An unauthenticated GET /checkpoint on the primary listener (:8080)
          MUST receive HTTP 401.
        applicability: [all]
        state: Active
      - id: CTRL-AC-02.2
        text: >-
          An authenticated GET /checkpoint with any valid identity MUST
          succeed (Cedar read:checkpoint is permitted for all).
        applicability: [all]
        state: Active
  - id: CTRL-AC-03
    title: Authorized Evidence Content Access
    objective: >-
      Evidence content in tile entry bundles is accessible only to identities
      with the auditors group membership. This prevents unauthorized access
      to vulnerability scans, control assessments, and security posture data.
    group: access-control
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-INFO-03 (evidence content disclosure)
    state: Active
    assessment-requirements:
      - id: CTRL-AC-03.1
        text: >-
          An authenticated GET /tile/* without auditors group membership
          MUST receive HTTP 403.
        applicability: [all]
        state: Active
      - id: CTRL-AC-03.2
        text: >-
          An authenticated GET /tile/* with auditors group membership
          MUST succeed.
        applicability: [all]
        state: Active
  - id: CTRL-AC-04
    title: Internal Listener Network Isolation
    objective: >-
      The internal tlog read listener binds to a non-routable address by
      default and is not exposed to external networks. Access is restricted
      to the container or pod network.
    group: access-control
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-DOS-02 (public endpoint flooding)
    state: Active
    assessment-requirements:
      - id: CTRL-AC-04.1
        text: >-
          The internal listener MUST bind to 127.0.0.1 by default. An
          explicit INTERNAL_LISTEN_HOST override is required for container
          deployments where cross-container access is needed.
        applicability: [all]
        state: Active
      - id: CTRL-AC-04.2
        text: >-
          The internal listener port MUST NOT be mapped to the host in
          the default compose configuration.
        applicability: [all]
        state: Active
  - id: CTRL-AC-05
    title: Cedar Policy Safety Floors
    objective: >-
      Embedded Cedar forbid/unless rules create non-bypassable safety floors
      for security-critical actions. Directory-added policies can add permits
      for new actions but cannot override the group membership requirements
      for read:entries (auditors) or publish (publishers), nor the target-
      scoped trust requirement for publish:artifact.
    group: access-control
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-ELEV-02 (policy directory override)
    state: Active
    assessment-requirements:
      - id: CTRL-AC-05.1
        text: >-
          A directory-added permit(principal, action == Action::"read:entries",
          resource) without the auditors group condition MUST NOT override the
          embedded forbid — the request MUST be denied.
        applicability: [all]
        state: Active
      - id: CTRL-AC-05.2
        text: >-
          A directory-added permit(principal, action == Action::"publish",
          resource) without the publishers group condition MUST NOT override
          the embedded forbid — the request MUST be denied.
        applicability: [all]
        state: Active
      - id: CTRL-AC-05.3
        text: >-
          A directory-added permit(principal, action == Action::"publish:artifact",
          resource) without the publisher_trusted condition MUST NOT override
          the embedded forbid — the request MUST be denied.
        applicability: [all]
        state: Active
  - id: CTRL-AC-06
    title: Publishers Group Authorization
    objective: >-
      Evidence submission endpoints (POST /api/ingest, POST /api/import)
      require the publishers group membership in the caller's OAuth2 Proxy
      identity. This coarse-grained gate prevents unauthorized identities
      from reaching the publish handler.
    group: access-control
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-SPOOF-01 (publisher trust bypass)
    state: Active
    assessment-requirements:
      - id: CTRL-AC-06.1
        text: >-
          An authenticated POST /api/ingest without publishers group membership
          MUST receive HTTP 403.
        applicability: [all]
        state: Active
      - id: CTRL-AC-06.2
        text: >-
          An authenticated POST /api/ingest with publishers group membership
          MUST proceed to handler-level authorization.
        applicability: [all]
        state: Active
  - id: CTRL-AC-07
    title: Trust Modification Authorization
    objective: >-
      Modification of trusted publisher lists for existing targets requires
      the caller to be an existing trusted publisher for that target. New
      target registrations with no prior publishers are exempt. This prevents
      privilege escalation from target registration to evidence publication.
    group: access-control
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-ELEV-03 (trust escalation)
    state: Active
    assessment-requirements:
      - id: CTRL-AC-07.1
        text: >-
          A TargetRegistration that adds trusted publishers to a target with
          existing publishers MUST be rejected if the caller is not an existing
          trusted publisher for that target.
        applicability: [all]
        state: Active
      - id: CTRL-AC-07.2
        text: >-
          A TargetRegistration that adds trusted publishers to a new target
          (no existing publishers) MUST be accepted from any authenticated
          publisher.
        applicability: [all]
        state: Active
  - id: CTRL-AC-08
    title: Import Path Compensating Controls
    objective: >-
      Until handler-level Cedar publish:artifact evaluation is added to
      POST /api/import, the publishers group MUST be restricted to operators
      trusted across all targets. Imported artifacts enter the append-only
      log and are detectable by the content monitor. This is a compensating
      control for T-SPOOF-04 (import path bypasses target-scoped trust).
    group: access-control
    threats:
      - reference-id: tlog-threats
        entries:
          - reference-id: tlog-threats
            remarks: Mitigates T-SPOOF-04 (import path publisher trust bypass)
    state: Active
    assessment-requirements:
      - id: CTRL-AC-08.1
        text: >-
          The publishers group membership MUST be limited to operators
          authorized to publish evidence for all targets until per-target
          Cedar authorization is added to the import handler.
        applicability: [all]
        state: Active
      - id: CTRL-AC-08.2
        text: >-
          Artifacts imported via POST /api/import MUST be appended to
          the transparency log with a traceable synthetic publisher
          identity (import:<reference>).
        applicability: [all]
        state: Active
